name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    # Fijado a propósito, no `ubuntu-latest`: desde que el runner pasó a Ubuntu
    # 26.04, `playwright install --with-deps` falla con
    # "Playwright does not support chromium on ubuntu26.04-x64" (Playwright
    # 1.57). Que la imagen del runner se mueva sola es justo lo que rompio la
    # primera ejecucion de este workflow. Subir a 26.04 cuando Playwright lo
    # soporte.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # No bloquea todavia: `develop` arrastra 4 errores de `rules-of-hooks` en
      # Dropdown.stories.tsx, que son alcance del lote 6. En cuanto ese lote los
      # cierre, hay que quitar el `continue-on-error` para que lint sea puerta.
      # Ver specs/lote-3.md G-15.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      # `pnpm build` construye los 6 paquetes en orden topologico (turbo con
      # `dependsOn: ["^build"]`). Antes se construia paquete a paquete segun una
      # deteccion de cambios que comparaba contra `main`, lo que en un PR a
      # `develop` daba un diff equivocado.
      - name: Build
        run: pnpm build

      # Incondicional y sin `|| echo`: antes era
      # `pnpm test:$pkg || echo "No tests for $pkg"`, que se tragaba el fallo, y
      # ademas invocaba scripts inexistentes (`test:ui`, `test:utils`) para dos de
      # los tres paquetes, asi que esos tests nunca corrian. CI salia verde sin
      # haber ejecutado nada.
      - name: Unit Tests
        run: pnpm test

      - name: Install Playwright Browsers
        run: pnpm --filter "@ownui/tw-theme" exec playwright install --with-deps chromium

      - name: E2E Tests
        run: pnpm --filter "@ownui/tw-theme" e2e

      - name: Upload E2E Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            packages/*/e2e/playwright-report/
            packages/*/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
